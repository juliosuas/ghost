version: "3.9"

services:
  ghost:
    build: .
    ports:
      - "127.0.0.1:${GHOST_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      # Override GHOST_HOST from .env (127.0.0.1) so the proxy can reach the app.
      GHOST_HOST: "0.0.0.0"
    volumes:
      - ghost_data:/app/data
      - ./investigations:/app/investigations
    restart: unless-stopped
    user: "1000:1000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ghost_data:
